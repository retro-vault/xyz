name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/xgdb-vsix/package-lock.json

      - name: Install xgdb VSIX dependencies
        run: npm ci
        working-directory: tools/xgdb-vsix

      - name: Build staged x distribution
        run: |
          make -C lib all
          make -C tools/xgdb-vsix all ROOT="$PWD" DIST_DIR="$PWD/bin/x" VSIX_STAGE_DIR="$PWD/bin/x/pkg/vsix"
          make -C src/xc all
          make stage-includes
          make stage-layout-cleanup
          make stage-xcc-support
          make stage-dist-docs
          make -C pkg all

      - name: Run C23 compatibility matrix
        run: make -C tests/c23 matrix PROFILE=setups/xcc-z80/profile-xcc-z80.json RUN_MODE=never

      - name: Archive x release payload
        run: tar -czf x.tar.gz -C bin x

      - name: Upload x artifact
        uses: actions/upload-artifact@v4
        with:
          name: x
          path: x.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: x.tar.gz
