name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/xdbg-vsix/package-lock.json

      - name: Install xdbg VSIX dependencies
        run: npm ci
        working-directory: tools/xdbg-vsix

      - name: Build xlink
        run: make -C src/xc

      - name: Build tools
        run: make -C tools

      - name: Build yos ROM
        run: make -C src/yos

      - name: Build hello microdrive image
        run: make -C tests/hello-yos image

      - name: Stage release tree
        run: |
          rm -rf dist
          mkdir -p dist/rom dist/tools/xlink dist/tools/microdrive dist/tools/serial dist/tools/appmake

          cp bin/targets/zxspectrum/roms/yos.rom dist/rom/yos.rom
          cp tests/microdrives/hello.mdr dist/rom/hello.mdr
          cp src/yos/README.md dist/rom/README.md
          cp src/yos/README.md dist/YOS.md

          cp bin/bin/xlink dist/tools/xlink/
          cp src/xc/xlink/README.md dist/tools/xlink/README.md
          cp src/xc/xlink/README.md dist/XLINK.md

          cp bin/bin/microdrive dist/tools/microdrive/
          cp tools/microdrive/README.md dist/tools/microdrive/README.md
          cp tools/microdrive/README.md dist/MICRODRIVE.md

          cp bin/bin/serial dist/tools/serial/
          cp tools/serial/README.md dist/tools/serial/README.md
          cp tools/serial/README.md dist/SERIAL.md

          cp bin/bin/appmake dist/tools/appmake/
          cp tools/appmake/README.md dist/tools/appmake/README.md
          cp tools/appmake/README.md dist/APPMAKE.md

      - name: Archive release payload
        run: tar -czf xyz-release.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xyz-release
          path: xyz-release.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: xyz-release.tar.gz
