name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: x/pkg/xgdb-vsix/package-lock.json

      - name: Install x extension dependencies
        run: npm ci
        working-directory: x/pkg/xgdb-vsix

      - name: Build all
        run: make all

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          command -v zip >/dev/null 2>&1 || { echo "zip not found"; exit 1; }
          mkdir -p release/x release/xext
          cp -a bin/x/. release/x/
          rm -rf release/x/pkg
          cp bin/x/pkg/vsix/*.vsix release/xext/
          (cd release && zip -qr ../x.zip x)
          (cd release && zip -qr ../xext.zip xext)

      - name: Upload x zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: x.zip
          path: x.zip

      - name: Upload x deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-deb
          path: bin/x/pkg/deb/x_*.deb

      - name: Upload x extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: xext.zip
          path: xext.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            x.zip
            xext.zip
            bin/x/pkg/deb/x_*.deb
